<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التقويم الختامي – تسمية الجزيئات</title>
<style>
  :root { --petrol:#0B4F6C; --coral:#F4845F; --turq:#3AAFA9; --green:#2E7D32; --red:#C62828; --bg:#F7FAF9; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Sakkal Majalla","Segoe UI",Tahoma,Arial,sans-serif; background:var(--bg); color:#1F3A5F; min-height:100vh; display:flex; flex-direction:column; }
  header { background:var(--petrol); color:#fff; padding:14px 22px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:30px; }
  .tag { background:var(--coral); border-radius:18px; padding:4px 14px; font-size:20px; }
  main { flex:1; max-width:1100px; width:100%; margin:0 auto; padding:22px 16px; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-size:24px; }
  .timer { width:86px; height:86px; border-radius:50%; border:8px solid var(--turq); display:flex; align-items:center; justify-content:center; font-size:38px; font-weight:bold; color:var(--petrol); font-family:Calibri,Arial; }
  .timer.low { border-color:var(--red); color:var(--red); }
  .q { background:#fff; border:3px solid var(--turq); border-radius:22px; padding:22px 26px; font-size:36px; font-weight:bold; line-height:1.5; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:20px; }
  .opt { font:inherit; font-size:32px; font-weight:bold; text-align:right; padding:16px 20px; border-radius:18px; border:3px solid #cfd8dc; background:#fff; color:#1F3A5F; cursor:pointer; display:flex; gap:14px; align-items:center; }
  .opt .l { width:48px; height:48px; border-radius:50%; background:var(--petrol); color:#fff; display:inline-flex; align-items:center; justify-content:center; flex:none; }
  .opt.right { border-color:var(--green); background:#E8F5E9; } .opt.right .l { background:var(--green); }
  .opt.wrong { border-color:var(--red); background:#FFEBEE; } .opt.wrong .l { background:var(--red); }
  .opt:disabled { cursor:default; }
  .fb { min-height:56px; margin-top:16px; font-size:30px; font-weight:bold; text-align:center; }
  .fb.ok { color:var(--green); } .fb.no { color:var(--red); }
  .next { font:inherit; font-size:28px; background:var(--coral); color:#fff; border:0; border-radius:26px; padding:10px 34px; cursor:pointer; display:block; margin:6px auto 0; visibility:hidden; }
  .lat { font-family:Calibri,Arial,sans-serif; direction:ltr; unicode-bidi:isolate; }
  .result { text-align:center; }
  .score { font-size:90px; font-weight:bold; color:var(--petrol); font-family:Calibri,Arial; direction:ltr; }
  .rows { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin:18px 0; }
  .rows span { font-size:30px; padding:10px 18px; border-radius:16px; background:#fff; border:2px solid #cfd8dc; }
  .rows .y { color:var(--green); border-color:var(--green); } .rows .n { color:var(--red); border-color:var(--red); }
  .start { font:inherit; font-size:32px; background:var(--turq); color:#fff; border:0; border-radius:30px; padding:14px 46px; cursor:pointer; }
  sub { font-size:.65em; }
  .mute { font-size:24px; background:#fff; border:0; border-radius:50%; width:44px; height:44px; cursor:pointer; vertical-align:middle; }
  @media (max-width:700px) { .opts { grid-template-columns:1fr; } .q { font-size:28px; } .opt { font-size:26px; } }
</style>
</head>
<body>
<header><h1>🏆 التقويم الختامي – تسمية الجزيئات</h1><span><button id="mute" class="mute" onclick="toggleMute()" title="الصوت">🔊</button> <span class="tag">تحصيلي كيمياء</span></span></header>
<main id="app"></main>
<script>
const Q = [
  { q: 'هو الحمض الذي يتألف من الهيدروجين وأيون أكسجيني:', o: ['الحمض الأكسجيني', 'الجزيء الثنائي', 'الحمض الثنائي', 'البروتون'], a: 0 },
  { q: 'اسم الجزيء <span class="lat">NF<sub>3</sub></span>:', o: ['ثلاثي فلوريد نيتريد', 'ثلاثي فلور نيتريد', 'ثلاثي فلوريد النيتروجين', 'ثلاثي فلورو النيتروجين'], a: 2 },
  { q: 'الاسم الشائع للمركب <span class="lat">N<sub>2</sub>H<sub>4</sub></span> هو الهيدرازين، ما الاسم العلمي له؟', o: ['رابع هيدريد ثنائي النيتروجين', 'رابع هيدريد الهيدرازين', 'رابع هيدريد أحادي النيتروجين', 'ثالث هيدريد ثنائي النيتروجين'], a: 0 },
  { q: 'الصيغة الجزيئية لحمض الهيدرويوديك:', o: ['<span class="lat">IH</span>', '<span class="lat">HI</span>', '<span class="lat">H<sub>2</sub>I</span>', '<span class="lat">IH<sub>2</sub></span>'], a: 1 },
];
// ---------- sounds (Web Audio, no files) ----------
let AC = null, muted = false;
function ac() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type = 'sine', v = 0.25, when = 0) {
  if (muted) return; const c = ac(), t0 = c.currentTime + when;
  const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + d + 0.05);
}
const SND = {
  tick: () => tone(880, 0.08, 'square', 0.06),
  tock: () => tone(1320, 0.12, 'square', 0.12),
  right: () => { tone(523, 0.18, 'triangle', 0.3); tone(659, 0.18, 'triangle', 0.3, 0.12); tone(784, 0.35, 'triangle', 0.3, 0.24); },
  wrong: () => { tone(220, 0.25, 'sawtooth', 0.18); tone(165, 0.4, 'sawtooth', 0.18, 0.2); },
  timeup: () => { tone(440, 0.3, 'square', 0.15); tone(330, 0.5, 'square', 0.15, 0.3); },
  start: () => { tone(392, 0.15, 'triangle', 0.25); tone(523, 0.25, 'triangle', 0.25, 0.15); },
  win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, k) => tone(f, 0.3, 'triangle', 0.3, k * 0.15)),
  ok: () => [392, 523, 659].forEach((f, k) => tone(f, 0.3, 'triangle', 0.25, k * 0.15)),
};
function toggleMute() { muted = !muted; document.getElementById('mute').textContent = muted ? '🔇' : '🔊'; }
const L = ['أ', 'ب', 'ج', 'د'];
const app = document.getElementById('app');
let i = 0, results = [], timer = null, t = 10;

function startScreen() {
  app.innerHTML = `<div class="result"><p style="font-size:34px"><b class="lat">${Q.length}</b> أسئلة اختيار من متعدد بنمط التحصيلي، لكل سؤال <b class="lat">10</b> ثوانٍ.</p>
  <p style="font-size:26px">فكّري وحدك، ثم ارفعي أصابعك برمز الإجابة، وتضغط المعلمة اختيار الصف.</p>
  <button class="start" onclick="go()">ابدئي ◀</button></div>`;
}
function go() { ac(); SND.start(); i = 0; results = []; ask(); }
function ask() {
  const q = Q[i]; t = 10;
  app.innerHTML = `<div class="top"><span>السؤال <b class="lat">${i + 1} / ${Q.length}</b></span><div class="timer" id="tm">${t}</div></div>
    <div class="q">${q.q}</div>
    <div class="opts">${q.o.map((o, k) => `<button class="opt" data-k="${k}"><span class="l">${L[k]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="fb" id="fb"></div>
    <button class="next" id="nx">${i < Q.length - 1 ? 'السؤال التالي ◀' : 'النتيجة ◀'}</button>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.k));
  document.getElementById('nx').onclick = () => { i++; i < Q.length ? ask() : done(); };
  clearInterval(timer);
  timer = setInterval(() => {
    t--; const tm = document.getElementById('tm'); if (!tm) return clearInterval(timer);
    tm.textContent = Math.max(t, 0); if (t <= 3) tm.classList.add('low');
    if (t > 3) SND.tick(); else if (t > 0) SND.tock();
    if (t <= 0) { clearInterval(timer); SND.timeup(); document.getElementById('fb').textContent = '⏰ انتهى الوقت! اختاري إجابة الصف'; document.getElementById('fb').className = 'fb'; }
  }, 1000);
}
function choose(k) {
  clearInterval(timer);
  const q = Q[i], btns = document.querySelectorAll('.opt'), fb = document.getElementById('fb');
  btns.forEach(b => b.disabled = true);
  btns[q.a].classList.add('right');
  if (k === q.a) { SND.right(); fb.textContent = '✔ إجابة صحيحة… أحسنتنّ!'; fb.className = 'fb ok'; results.push(true); }
  else { SND.wrong(); btns[k].classList.add('wrong'); fb.innerHTML = `✘ الإجابة الصحيحة: ${L[q.a]}) ${q.o[q.a]}`; fb.className = 'fb no'; results.push(false); }
  document.getElementById('nx').style.visibility = 'visible';
}
function done() {
  const s = results.filter(Boolean).length;
  (s >= Q.length / 2 ? SND.win : SND.ok)();
  app.innerHTML = `<div class="result"><p style="font-size:34px">نتيجة الصف</p><div class="score">${s} / ${Q.length}</div>
    <div class="rows">${results.map((r, k) => `<span class="${r ? 'y' : 'n'}">س <b class="lat">${k + 1}</b> ${r ? '✔' : '✘'}</span>`).join('')}</div>
    <p style="font-size:30px">${s === Q.length ? '🌟 ممتاز! أتقنتنّ تسمية الجزيئات' : s >= Q.length / 2 ? '👏 أداء جيد… راجعن الأسئلة الخاطئة' : '💪 لنراجع قواعد التسمية معاً'}</p>
    <button class="start" onclick="go()">إعادة ↻</button></div>`;
}
startScreen();
</script>
</body>
</html>
